<div id="internalReportOptionsModal" class="saas-modal-backdrop" style="display:none;">
  <div class="saas-modal-card" style="max-width:460px;">
    
    <div class="saas-modal-header" style="border-bottom-color:#2e7d32;">
      <h3 style="margin:0; color:var(--heading-color); display:flex; align-items:center; gap:8px;">
        <i data-lucide="trending-up" style="width:18px; height:18px; color:#66bb6a;"></i> Internal Sales Report Options
      </h3>
      <button class="saas-modal-close" onclick="document.getElementById('internalReportOptionsModal').style.display='none'">×</button>
    </div>

    <div style="margin-bottom:12px; font-size:0.85rem; color:var(--text-main);">
      Account: <strong id="internalReportCustomerName" style="color:var(--heading-color);"></strong>
      <div style="opacity:0.8; margin-top:4px;">Select the columns to include in the PDF export:</div>
    </div>

    <div class="saas-meta-well" style="display:flex; flex-direction:column; gap:10px; margin-bottom:16px;">
      <label style="cursor:pointer; font-weight:600; font-size:0.88rem; display:flex; align-items:center; gap:8px;"><input type="checkbox" id="chkIntDesc" checked> Catalog Description</label>
      <label style="cursor:pointer; font-weight:600; font-size:0.88rem; display:flex; align-items:center; gap:8px;"><input type="checkbox" id="chkIntHist" checked> Historical Volume</label>
      <label style="cursor:pointer; font-weight:600; font-size:0.88rem; display:flex; align-items:center; gap:8px;"><input type="checkbox" id="chkIntOnHand" checked> On-Hand Stock</label>
      <label style="cursor:pointer; font-weight:600; font-size:0.88rem; display:flex; align-items:center; gap:8px;"><input type="checkbox" id="chkIntPrice" checked> Selling Price</label>
      <label style="cursor:pointer; font-weight:600; font-size:0.88rem; display:flex; align-items:center; gap:8px;"><input type="checkbox" id="chkIntCost" checked> Unit Cost</label>
    </div>

    <div class="saas-modal-footer">
      <button class="btn-saas-secondary" style="flex:1; padding:10px;" onclick="document.getElementById('internalReportOptionsModal').style.display='none'">Cancel</button>
      <button id="btnExportInternalReport" class="btn-saas-primary" style="flex:2; margin-top:0; padding:10px; background:#2e7d32;">🖨️ Export PDF</button>
    </div>

  </div>
</div>
