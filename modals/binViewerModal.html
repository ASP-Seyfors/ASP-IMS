<div id="binViewerModal" class="saas-modal-backdrop" style="display:none;">
  <div class="saas-modal-card" style="max-width:540px; max-height:85vh;">
    
    <div class="saas-modal-header" style="border-bottom-color:#f57f17;">
      <h3 style="margin:0; color:var(--heading-color); display:flex; align-items:center; gap:8px;">
        <i data-lucide="archive" style="width:18px; height:18px; color:#ffa726;"></i> Customer Reserved Bins
      </h3>
      <button class="saas-modal-close" onclick="document.getElementById('binViewerModal').style.display='none'">×</button>
    </div>

    <p style="font-size:0.83rem; color:var(--text-main); opacity:0.8; margin:0 0 12px 0; flex-shrink:0;">
      Expand a customer account below to inspect or un-reserve items currently allocated in physical warehouse bins.
    </p>

    <div id="binViewerContent" class="saas-modal-body" style="padding-right:4px;">
      <!-- Injected via JS -->
    </div>

    <div class="saas-modal-footer" style="justify-content:flex-end;">
      <button class="btn-saas-secondary" style="padding:9px 20px;" onclick="document.getElementById('binViewerModal').style.display='none'">Close Viewer</button>
    </div>

  </div>
</div>
