<div id="stockReportEditorModal" class="saas-modal-backdrop" style="display:none;">
  <div class="saas-modal-card" style="max-width:740px; max-height:90vh;">
    
    <div class="saas-modal-header" style="border-bottom-color:#7b1fa2;">
      <h3 style="margin:0; color:var(--heading-color);" id="stockReportTitle">📄 Build Customer Inventory Stock Report</h3>
      <button class="saas-modal-close" onclick="document.getElementById('stockReportEditorModal').style.display='none'">×</button>
    </div>

    <div class="saas-modal-body">
      <div id="stockReportHeaderBox" class="saas-callout-row info" style="margin-bottom:12px;">
        <!-- Dynamic instructions injected here -->
      </div>

      <div class="saas-meta-well saas-checkbox-bar" style="margin-bottom:12px; padding:10px 14px;">
        <label><input type="checkbox" id="chkIncludeDescFlyer" checked> Include Description</label>
        <label><input type="checkbox" id="chkIncludeQtyFlyer" checked> Include Quantity</label>
        <label><input type="checkbox" id="chkIncludePriceInReport" checked> Include Unit Price</label>
      </div>

      <div id="stockReportNoteContainer" style="margin-bottom:12px; display:none;">
        <label class="saas-label" style="display:block; margin-bottom:4px;">📝 Flyer Intro Note / Message</label>
        <textarea id="flyerNoteInput" rows="3" class="saas-input" style="resize:vertical;" placeholder="e.g. Good morning, we have the following items in stock and ready to ship..."></textarea>
      </div>

      <div id="stockReportActionRow" style="display:none; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <strong style="font-size:0.88rem; color:var(--heading-color);" id="stockReportItemCount">Available Inventory</strong>
        <div style="display:flex; gap:6px;">
          <button class="btn-saas-sub" style="background:#0277bd; color:#fff; border:none;" onclick="document.querySelectorAll('.flyer-chk').forEach(c => c.checked = true)">Select All</button>
          <button class="btn-saas-sub" onclick="document.querySelectorAll('.flyer-chk').forEach(c => c.checked = false)">Deselect All</button>
        </div>
      </div>

      <div style="margin-bottom:10px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
        <input type="text" id="flyerSearchBox" class="saas-input" onkeyup="ReportsManager.filterFlyerItems()" placeholder="🔍 Search by REF or Description..." style="flex:1;">
        <label class="saas-kpi-pill" style="cursor:pointer; font-weight:700; display:inline-flex; align-items:center; gap:6px; padding:8px 12px;">
          <input type="checkbox" id="chkShowSelectedFlyer" onchange="ReportsManager.filterFlyerItems()"> Show Selected Only
        </label>
      </div>

      <div id="reportItemRowsContainer" class="saas-table-scroll" style="max-height:290px; padding:8px;">
        <!-- Dynamic rows injected here -->
      </div>

      <div style="margin-top:8px;">
        <button id="btnAddFlyerRow" class="btn-saas-sub" style="border-color:var(--heading-color); color:var(--heading-color);" onclick="ReportsManager.addBlankRowToReportEditor()">+ Add Custom Row to Flyer</button>
      </div>
    </div>

    <div class="saas-modal-footer">
      <button class="btn-saas-secondary" style="padding:10px 16px;" onclick="document.getElementById('stockReportEditorModal').style.display='none'">Cancel</button>
      <button id="btnExportStockReportPdf" class="btn-saas-primary" style="flex:1; margin-top:0; padding:10px; background:#7b1fa2;">🖨️ Export PDF</button>
      <button id="btnExportStockReportEmail" class="btn-saas-primary" style="flex:1; margin-top:0; padding:10px; background:#2e7d32;">📧 Copy for Email</button>
    </div>

  </div>
</div>
