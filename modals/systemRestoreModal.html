<div id="systemRestoreModal" class="saas-modal-backdrop" style="display:none;">
  <div class="saas-modal-card" style="max-width:460px;">
    
    <div class="saas-modal-header" style="border-bottom-color:#c62828;">
      <h3 style="margin:0; color:#ef5350; display:flex; align-items:center; gap:8px;">
        <i data-lucide="rewind" style="width:18px; height:18px;"></i> Cloud System Restore
      </h3>
      <button class="saas-modal-close" onclick="document.getElementById('systemRestoreModal').style.display='none'">×</button>
    </div>

    <p style="font-size:0.85rem; color:var(--text-main); opacity:0.85; line-height:1.45; margin:0 0 14px 0;">
      Select a verified Full Stocktake baseline below. The system will download all subsequent Cloud Vault payloads and replay them chronologically to rebuild your inventory.
    </p>

    <div style="margin-bottom:18px;">
      <label class="saas-label" style="display:block; margin-bottom:6px;">Select Stocktake Baseline</label>
      <select id="restoreBaselineSelect" class="saas-select" style="font-weight:700; border-color:#ef5350;">
        <!-- Options injected via JS -->
      </select>
    </div>

    <div class="saas-modal-footer">
      <button class="btn-saas-secondary" style="flex:1; padding:11px;" onclick="document.getElementById('systemRestoreModal').style.display='none'">Cancel</button>
      <button class="btn-saas-primary" style="flex:1.5; margin-top:0; padding:11px; background:#c62828;" onclick="AuditManager.executeCloudEventReplay(); document.getElementById('systemRestoreModal').style.display='none';">
        ⚠️ Execute Replay
      </button>
    </div>

  </div>
</div>
