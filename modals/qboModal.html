<div id="qboModal" class="saas-modal-backdrop" style="display:none;">
  <div class="saas-modal-card" style="max-width:460px;">
    
    <div class="saas-modal-header" style="border-bottom-color:#0277bd;">
      <h3 style="margin:0; color:var(--heading-color); display:flex; align-items:center; gap:8px;">
        <i data-lucide="cloud-download" style="width:18px; height:18px;"></i> QuickBooks Online Sync
      </h3>
      <button class="saas-modal-close" onclick="document.getElementById('qboModal').style.display='none'">×</button>
    </div>

    <p style="font-size:0.88rem; color:var(--text-main); opacity:0.85; line-height:1.45; margin:0 0 18px 0;">
      Pull the latest open invoices from QuickBooks Online into the staged fulfillment feed.
    </p>

    <div class="saas-modal-footer">
      <button class="btn-saas-secondary" style="flex:1; padding:11px;" onclick="document.getElementById('qboModal').style.display='none'">Cancel</button>
      <button class="btn-saas-primary" style="flex:2; margin-top:0; padding:11px;" onclick="triggerQboSync(event); document.getElementById('qboModal').style.display='none';">
        Fetch QBO Orders
      </button>
    </div>

  </div>
</div>
