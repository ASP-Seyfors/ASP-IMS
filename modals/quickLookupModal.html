<div id="quickLookupModal" class="saas-modal-backdrop" style="display:none;">
  <div class="saas-modal-card" style="max-width:520px; max-height:90vh;">
    
    <div class="saas-modal-header" style="border-bottom-color:#26a69a;">
      <h3 style="margin:0; color:var(--heading-color); display:flex; align-items:center; gap:8px;">
        <i data-lucide="search" style="width:18px; height:18px; color:#26a69a;"></i> Quick Catalog & Lot Lookup
      </h3>
      <button class="saas-modal-close" onclick="document.getElementById('quickLookupModal').style.display='none'">×</button>
    </div>

    <div class="saas-modal-body">
      <div class="lookup-box-saas" style="margin-bottom:12px;">
        <label class="saas-label" style="display:block; margin-bottom:6px;">Scan or Enter REF / GTIN</label>
        <div style="display:flex; gap:8px;">
          <input type="text" id="quickLookupInput" class="saas-input font-mono input-highlight" placeholder="e.g. 8698G or Scan 2D Barcode" style="flex:1; text-transform:uppercase;" onkeypress="if(event.key==='Enter') UIManager.executeQuickLookup()">
          <button class="btn-saas-primary" style="width:auto; margin-top:0; padding:10px 18px; background:#00796b;" onclick="UIManager.executeQuickLookup()">Search</button>
        </div>
        <div style="margin-top:10px;">
          <label style="font-size:0.82rem; color:var(--text-main); cursor:pointer; font-weight:600; display:inline-flex; align-items:center; gap:6px;">
            <input type="checkbox" id="chkFilterBoxVariantsOnly" onchange="UIManager.executeQuickLookup()"> Show Box (Bundle) Variants Only
          </label>
        </div>
      </div>

      <div style="margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; gap:10px;">
        <button id="btnRequestRestock" class="btn-saas-sub-orange" style="padding:7px 14px; font-size:0.8rem;" onclick="UIManager.requestItemRestock()">🔔 Flag for Restock</button>
        <div id="restockPendingBadge" style="display:none; align-items:center; gap:6px; color:#ef5350; font-size:0.8rem; font-weight:700;">
          <div style="width:10px; height:10px; background-color:#ef5350; border-radius:50%;"></div> Restock Pending
        </div>
      </div>

      <div id="quickLookupResult" style="min-height:110px;">
        <div style="text-align:center; color:var(--text-main); opacity:0.65; padding:20px; font-size:0.88rem;">Scan or type a REF/GTIN above to inspect live stock and lot records.</div>
      </div>
    </div>

  </div>
</div>
