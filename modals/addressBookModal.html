<div id="addressBookModal" class="saas-modal-backdrop" style="display:none;">
  <div class="saas-modal-card" style="max-width:820px; max-height:90vh;">
    
    <!-- Child 1: Modal Header -->
    <div class="saas-modal-header" style="border-bottom-color:#8e24aa;">
      <h2 style="margin:0; border:none; padding:0; color:var(--heading-color); display:flex; align-items:center; gap:8px;">
        <i data-lucide="book-open" style="width:22px; height:22px; color:#ba68c8;"></i> Address Book Manager
      </h2>
      <button class="saas-modal-close" onclick="document.getElementById('addressBookModal').style.display='none'">×</button>
    </div>

    <!-- Child 2: Scrollable Container (Required by ReportsManager.editAddressBookEntry) -->
    <div class="saas-modal-body">
      
      <!-- Entry Form -->
      <div class="saas-meta-well" style="margin-bottom:18px;">
        <div class="card-section-title" style="font-size:0.85rem; margin-bottom:10px;">Add / Edit Contact</div>
        <div class="saas-field-grid-2col" style="gap:10px; margin-bottom:0;">
          <input type="text" id="abContactId" class="saas-input" placeholder="Contact ID (System Key)*" style="font-weight:700; border-color:var(--heading-color);">
          <input type="text" id="abCompany" class="saas-input" placeholder="Formal Company Name">
          <input type="text" id="abContactName" class="saas-input" placeholder="Contact Person">
          <input type="text" id="abEmail" class="saas-input" placeholder="Email Address">
          <input type="text" id="abPhone" class="saas-input" placeholder="Phone Number">
          <div style="display:flex; gap:8px;">
            <select id="abMethod" class="saas-select" style="flex:1;">
              <option value="FEDEX">FedEx</option>
              <option value="UPS">UPS</option>
            </select>
            <input type="text" id="abAccount" class="saas-input font-mono" placeholder="Shipping Account #" style="flex:2;">
          </div>
          
          <input type="text" id="abAddress1" class="saas-input" placeholder="Address Line 1" style="grid-column: 1 / -1;">
          <input type="text" id="abAddress2" class="saas-input" placeholder="Address Line 2 (Suite, Unit)" style="grid-column: 1 / -1;">
          
          <div style="display:flex; gap:8px; grid-column: 1 / -1;">
            <input type="text" id="abCity" class="saas-input" placeholder="City" style="flex:3;">
            <input type="text" id="abState" class="saas-input font-mono" placeholder="ST" style="flex:1; text-align:center; text-transform:uppercase;">
            <input type="text" id="abZip" class="saas-input font-mono" placeholder="Zip" style="flex:2;">
            <input type="text" id="abCountry" class="saas-input font-mono" placeholder="Country" value="US" style="flex:1; text-align:center; text-transform:uppercase;">
          </div>
          
          <textarea id="abNotes" class="saas-input" placeholder="Shipping Notes / Terms" style="grid-column: 1 / -1; height:48px; resize:none;"></textarea>

          <div style="grid-column: 1 / -1; display:flex; gap:10px; margin-top:4px;">
            <button class="btn-saas-secondary" style="flex:1; padding:10px;" onclick="ReportsManager.clearAddressBookForm()">Clear Form</button>
            <button id="btnSaveAbEntry" class="btn-saas-primary" style="flex:2.5; margin-top:0; padding:10px; background:#2e7d32;" onclick="ReportsManager.saveAddressBookEntry()">💾 Save to Database</button>
          </div>
        </div>
      </div>

      <!-- Live Roster Grid -->
      <div class="card-section-title" style="font-size:0.85rem; margin-bottom:10px;">
        Saved Contacts (<span id="abContactCount">0</span>)
      </div>
      <div id="addressBookGrid" style="display:flex; flex-direction:column; gap:8px;">
        <!-- JS will inject cards here -->
      </div>
      
    </div>

    <!-- Child 3: Pinned Footer -->
    <div class="saas-modal-footer" style="justify-content:flex-end;">
      <button class="btn-saas-secondary" style="padding:9px 20px;" onclick="document.getElementById('addressBookModal').style.display='none'">Close Address Book</button>
    </div>

  </div>
</div>
