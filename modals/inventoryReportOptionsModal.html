<div id="inventoryReportOptionsModal" class="saas-modal-backdrop" style="display:none;">
  <div class="saas-modal-card" style="max-width:440px;">
    
    <div class="saas-modal-header" style="border-bottom-color:#2e7d32;">
      <h3 style="margin:0; color:var(--heading-color); display:flex; align-items:center; gap:8px;">
        <i data-lucide="package" style="width:18px; height:18px; color:#66bb6a;"></i> On-Hand Stock Report Options
      </h3>
      <button class="saas-modal-close" onclick="document.getElementById('inventoryReportOptionsModal').style.display='none'">×</button>
    </div>

    <p style="margin:0 0 12px 0; font-size:0.83rem; color:var(--text-main); opacity:0.85;">
      Select the columns to include in the printable PDF stock report:
    </p>

    <div class="saas-meta-well" style="display:flex; flex-direction:column; gap:10px; margin-bottom:16px;">
      <label style="cursor:pointer; font-weight:600; font-size:0.88rem; display:flex; align-items:center; gap:8px;"><input type="checkbox" id="chkInvMfr" checked> Manufacturer</label>
      <label style="cursor:pointer; font-weight:600; font-size:0.88rem; display:flex; align-items:center; gap:8px;"><input type="checkbox" id="chkInvDesc" checked> Item Description</label>
      <label style="cursor:pointer; font-weight:700; font-size:0.88rem; color:var(--heading-color); display:flex; align-items:center; gap:8px;"><input type="checkbox" id="chkInvAvail" checked> Available Quantity (Sales)</label>
      <label style="cursor:pointer; font-weight:600; font-size:0.88rem; display:flex; align-items:center; gap:8px;"><input type="checkbox" id="chkInvPrice" checked> Selling Price</label>
      <div style="border-top:1px dashed var(--border-color); margin:2px 0;"></div>
      <label style="cursor:pointer; font-size:0.83rem; opacity:0.85; display:flex; align-items:center; gap:8px;"><input type="checkbox" id="chkInvTotal"> Total Physical Qty (Internal)</label>
      <label style="cursor:pointer; font-size:0.83rem; opacity:0.85; display:flex; align-items:center; gap:8px;"><input type="checkbox" id="chkInvRes"> Reserved Qty (Internal)</label>
    </div>

    <div class="saas-modal-footer">
      <button class="btn-saas-secondary" style="flex:1; padding:10px;" onclick="document.getElementById('inventoryReportOptionsModal').style.display='none'">Cancel</button>
      <button class="btn-saas-primary" style="flex:2; margin-top:0; padding:10px; background:#2e7d32;" onclick="ReportsManager.generateInventoryReport('in_stock'); document.getElementById('inventoryReportOptionsModal').style.display='none';">
        <i data-lucide="printer" style="width:16px; height:16px; vertical-align:middle; margin-right:6px;"></i>Generate PDF Report
      </button>
    </div>

  </div>
</div>
