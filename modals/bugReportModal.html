<div id="bugReportModal" class="saas-modal-backdrop" style="display:none; z-index:999999;">
  <div class="saas-modal-card" style="max-width:500px;">
    
    <div class="saas-modal-header" style="border-bottom-color:#c62828;">
      <h3 style="margin:0; color:#ef5350; display:flex; align-items:center; gap:8px;">
        <i data-lucide="bug" style="width:18px; height:18px;"></i> Report a System Issue
      </h3>
      <button class="saas-modal-close" onclick="document.getElementById('bugReportModal').style.display='none'">×</button>
    </div>

    <p style="font-size:0.83rem; color:var(--text-main); opacity:0.8; margin:0 0 14px 0;">
      Describe the error or unexpected behavior below. Session diagnostic metadata will be attached automatically.
    </p>

    <div class="saas-modal-body" style="display:flex; flex-direction:column; gap:12px;">
      <div>
        <label class="saas-label" style="display:block; margin-bottom:4px;">Issue Category</label>
        <select id="bugCategorySelect" class="saas-select">
          <option value="General Bug / App Error">🐞 General Bug / App Error</option>
          <option value="Scanning / Barcode Issue">📦 Scanning / Barcode Issue</option>
          <option value="Database Correction">🗄️ Database / Item Info Correction</option>
          <option value="Feature Request">✨ Feature Request / Suggestion</option>
          <option value="Other">❓ Other / Not Sure</option>
        </select>
      </div>
      <div>
        <label class="saas-label" style="display:block; margin-bottom:4px;">Issue Details</label>
        <textarea id="bugDescInput" rows="4" class="saas-input" style="resize:vertical;" placeholder="What were you doing when the issue occurred?"></textarea>
      </div>
    </div>

    <div class="saas-modal-footer">
      <button class="btn-saas-secondary" style="flex:1; padding:11px;" onclick="document.getElementById('bugReportModal').style.display='none'">Cancel</button>
      <button id="btnSubmitBug" class="btn-saas-primary" style="flex:2; margin-top:0; padding:11px; background:#c62828;" onclick="UIManager.submitBugPayload()">Submit Report</button>
    </div>

  </div>
</div>
