<div id="shipmentTrackingModal" class="saas-modal-backdrop" style="display:none;">
  <div class="saas-modal-card" style="max-width:840px; max-height:90vh;">
    
    <div class="saas-modal-header" style="border-bottom-color:#0277bd;">
      <h2 style="margin:0; border:none; padding:0; color:var(--heading-color); display:flex; align-items:center; gap:8px;">
        <i data-lucide="truck" style="width:22px; height:22px;"></i> Active Shipments Hub
      </h2>
      <button class="saas-modal-close" onclick="document.getElementById('shipmentTrackingModal').style.display='none'">×</button>
    </div>
    
    <div class="saas-modal-body">
      <div class="saas-field-grid-2col" style="margin-bottom:0;">
        
        <!-- INCOMING -->
        <div class="saas-meta-well" style="margin-bottom:0; border-top:3px solid #f57f17;">
          <div class="flex-between" style="border-bottom: 1px solid var(--border-color); padding-bottom: 8px; margin-bottom:10px;">
            <span class="saas-label" style="color: #ffa726; font-size:0.85rem;">📥 Incoming (Pending)</span>
            <button class="btn-saas-sub-orange" onclick="openShipmentEditor('Incoming', 'NEW', '{}')">+ Add Incoming</button>
          </div>
          <div id="trackIncomingList" style="max-height: 400px; overflow-y: auto; font-size: 0.85rem; padding-right:4px;"></div>
        </div>
        
        <!-- OUTGOING -->
        <div class="saas-meta-well" style="margin-bottom:0; border-top:3px solid #2e7d32;">
          <div class="flex-between" style="border-bottom: 1px solid var(--border-color); padding-bottom: 8px; margin-bottom:10px;">
            <span class="saas-label" style="color: #66bb6a; font-size:0.85rem;">📤 Outgoing (Pending)</span>
          </div>
          <div id="trackOutgoingList" style="max-height: 400px; overflow-y: auto; font-size: 0.85rem; padding-right:4px;"></div>
        </div>

      </div>
    </div>

  </div>
</div>
