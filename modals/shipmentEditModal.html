<div id="shipmentEditModal" class="saas-modal-backdrop" style="display:none;">
  <div class="saas-modal-card" style="max-width:440px;">
    
    <div class="saas-modal-header" style="border-bottom-color:#0277bd;">
      <h2 id="shipEditTitle" style="margin:0; border:none; padding:0; color:var(--heading-color); font-size:1.15rem;">Edit Shipment</h2>
      <button class="saas-modal-close" onclick="document.getElementById('shipmentEditModal').style.display='none'">×</button>
    </div>

    <div class="saas-modal-body" style="display:flex; flex-direction:column; gap:10px;">
      <input type="hidden" id="shipEditType">
      <input type="hidden" id="shipEditRowIdx">
      
      <div class="saas-field-grid-2col" style="margin-bottom:0;">
        <div>
          <label class="saas-label" style="display:block; margin-bottom:4px;">Date</label>
          <input type="text" id="shipEditDate" class="saas-input">
        </div>
        <div>
          <label class="saas-label" style="display:block; margin-bottom:4px;">Status</label>
          <select id="shipEditStatus" class="saas-select">
            <option value="Pending">Pending</option>
            <option value="In Transit">In Transit</option>
            <option value="Delivered">Delivered</option>
            <option value="Cancelled">Cancelled</option>
          </select>
        </div>
      </div>
      
      <div>
        <label class="saas-label" style="display:block; margin-bottom:4px;">Partner / Account Name</label>
        <input type="text" id="shipEditPartner" class="saas-input" style="font-weight:700;">
      </div>

      <div class="saas-field-grid-2col" style="margin-bottom:0;">
        <div>
          <label class="saas-label" style="display:block; margin-bottom:4px;">PO / Invoice</label>
          <input type="text" id="shipEditPo" class="saas-input">
        </div>
        <div>
          <label class="saas-label" style="display:block; margin-bottom:4px;">Carrier</label>
          <input type="text" id="shipEditCarrier" class="saas-input">
        </div>
      </div>

      <div>
        <label class="saas-label" style="display:block; margin-bottom:4px;">Tracking Number</label>
        <input type="text" id="shipEditTracking" class="saas-input font-mono">
      </div>

      <div class="saas-field-grid-2col" style="margin-bottom:0;">
        <div>
          <label class="saas-label" style="display:block; margin-bottom:4px;">Estimated Arrival (ETA)</label>
          <input type="text" id="shipEditEta" class="saas-input">
        </div>
        <div>
          <label class="saas-label" style="display:block; margin-bottom:4px;">Notes</label>
          <input type="text" id="shipEditNotes" class="saas-input">
        </div>
      </div>

      <div id="shipEditOutboundExtra" style="display:none; flex-direction:column; gap:10px;">
        <div class="saas-field-grid-2col" style="margin-bottom:0;">
          <div>
            <label class="saas-label" style="display:block; margin-bottom:4px;">Weight (lbs)</label>
            <input type="text" id="shipEditWeight" class="saas-input font-mono">
          </div>
          <div>
            <label class="saas-label" style="display:block; margin-bottom:4px;">Dims (LxWxH)</label>
            <input type="text" id="shipEditDims" class="saas-input font-mono">
          </div>
        </div>
      </div>
    </div>

    <div class="saas-modal-footer">
      <button class="btn-saas-secondary" style="flex: 1; padding: 11px;" onclick="document.getElementById('shipmentEditModal').style.display='none'">Cancel</button>
      <button id="btnSaveShipmentEdit" class="btn-saas-primary" style="flex: 2; margin-top:0; padding: 11px;" onclick="saveShipmentEdit()">💾 Save Changes</button>
    </div>

  </div>
</div>
