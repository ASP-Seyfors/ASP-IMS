<!-- =======================================================================
  * Allied Surgical Products - Inventory Management System
  * File: modals/shipmentManagerModal.html (Modern Enterprise SaaS Layout)
  ======================================================================= -->
<div id="shipmentManagerModal" class="saas-modal-backdrop" style="display:none;">
  <div class="saas-modal-card" style="max-width:920px; max-height:94vh;">
    
    <!-- Modal Header -->
    <div class="saas-modal-header" style="border-bottom-color:#7b1fa2;">
      <h2 style="margin:0; border:none; padding:0; color:var(--heading-color); display:flex; align-items:center; gap:8px;">
        <i data-lucide="package-check" style="width:22px; height:22px; color:#ba68c8;"></i> Outbound Shipment Manager
      </h2>
      <button class="saas-modal-close" onclick="ShippingManager.skipAndComplete()">×</button>
    </div>

    <!-- Scrollable Content -->
    <div class="saas-modal-body">
      <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap:18px;">
        
        <!-- LEFT COLUMN: Rules & Destination Address -->
        <div style="display: flex; flex-direction: column; gap: 14px;">
          
          <!-- Customer Shipping Rules Well -->
          <div class="saas-meta-well" style="margin-bottom:0;">
            <div class="card-section-title" style="font-size:0.85rem; margin-bottom:10px;">
              <i data-lucide="clipboard-list" style="width:15px; height:15px; vertical-align:middle; margin-right:6px;"></i>Customer Shipping Rules
            </div>

            <div class="saas-callout-row info" style="margin-bottom: 12px;">
              <label class="saas-label" style="display: block; margin-bottom: 4px;">Load from Address Book</label>
              <select id="shipAddressBookSelect" class="saas-select" style="margin-bottom: 10px;" onchange="ShippingManager.loadFromAddressBook(this.value)">
                <option value="">-- Load Saved Address --</option>
              </select>
              
              <div style="display: flex; gap: 8px; align-items: flex-end;">
                <div style="flex: 1;">
                  <label class="saas-label" style="display:block; margin-bottom: 4px;">Customer / Company ID</label>
                  <input type="text" id="shipCustName" class="saas-input" placeholder="Company Name for Database" oninput="ShippingManager.resetQuoteUI()">
                </div>
                <button id="btnSaveAddress" class="btn-saas-primary" style="width:auto; margin-top:0; padding:10px 14px; font-size:0.82rem; white-space:nowrap;" onclick="ShippingManager.saveAddressBookEntry()">
                  <i data-lucide="save" style="width:14px; height:14px; vertical-align:middle; margin-right:4px;"></i>Save Info
                </button>
              </div>
            </div>

            <div class="saas-field-grid-2col" style="margin-bottom: 10px;">
              <div>
                <label class="saas-label" style="display:block; margin-bottom:4px;">Carrier</label>
                <select id="shipCarrier" class="saas-select" onchange="ShippingManager.updateCarrierUI(); ShippingManager.resetQuoteUI();">
                  <option value="FEDEX">FedEx</option>
                  <option value="UPS">UPS</option>
                </select>
              </div>
              <div>
                <label class="saas-label" style="display:block; margin-bottom:4px;">Service Level</label>
                <select id="shipServiceType" class="saas-select" onchange="ShippingManager.resetQuoteUI()">
                  <option value="FEDEX_GROUND">FedEx Ground</option>
                  <option value="PRIORITY_OVERNIGHT">Priority Overnight (by 10:30 AM)</option>
                  <option value="STANDARD_OVERNIGHT">Standard Overnight (by 8:00 PM)</option>
                  <option value="FIRST_OVERNIGHT">First Overnight (by 8:00 AM)</option>
                  <option value="FEDEX_2_DAY">FedEx 2Day</option>
                  <option value="FEDEX_EXPRESS_SAVER">Express Saver (3 Days)</option>
                </select>
              </div>
            </div>

            <div style="margin-bottom: 10px;">
              <label class="saas-label" style="display:block; margin-bottom:4px;">Carrier Account Number</label>
              <input type="text" id="shipAccountNum" class="saas-input font-mono" placeholder="e.g. 208469018" oninput="ShippingManager.resetQuoteUI()">
              <label style="font-size:0.8rem; font-weight:700; color:var(--heading-color); display:inline-flex; align-items:center; gap:6px; margin-top:8px; cursor:pointer;">
                <input type="checkbox" id="chkUseCompanyAccount" onchange="ShippingManager.handleCompanyAccountToggle()">
                Use ASP Company Account
              </label>
            </div>

            <div>
              <label class="saas-label" style="display:block; margin-bottom:4px;">Special Instructions</label>
              <textarea id="shipInstructions" class="saas-input" style="height: 52px; resize: none;"></textarea>
            </div>
          </div>

          <!-- Destination Address Well -->
          <div class="saas-meta-well" style="margin-bottom:0;">
            <div class="card-section-title" style="font-size:0.85rem; margin-bottom:10px;">
              <i data-lucide="map-pin" style="width:15px; height:15px; vertical-align:middle; margin-right:6px;"></i>Destination Address
            </div>
            <div style="display:flex; flex-direction:column; gap:8px;">
              <input type="text" id="shipAddressContact" class="saas-input" placeholder="Contact Person Name">
              <input type="text" id="shipAddressCompany" class="saas-input" placeholder="Company Name" style="font-weight:700;">
              <input type="text" id="shipAddress1" class="saas-input" placeholder="Address Line 1" oninput="ShippingManager.resetQuoteUI()">
              <input type="text" id="shipAddress2" class="saas-input" placeholder="Address Line 2 (Suite, Floor, etc.)" oninput="ShippingManager.resetQuoteUI()">
              
              <div style="display:flex; gap:8px; width:100%;">
                <input type="text" id="shipAddressCity" class="saas-input" placeholder="City" style="flex:4; min-width:0;" oninput="ShippingManager.resetQuoteUI()">
                <input type="text" id="shipAddressState" class="saas-input font-mono" placeholder="ST" maxlength="20" style="flex:2; min-width:0; text-align:center; text-transform:uppercase;" oninput="ShippingManager.resetQuoteUI()" onblur="ShippingManager.formatStateUI('shipAddressState')">
                <input type="text" id="shipAddressZip" class="saas-input font-mono" placeholder="Zip" style="flex:3; min-width:0;" oninput="ShippingManager.resetQuoteUI()">
                <input type="text" id="shipAddressCountry" class="saas-input font-mono" placeholder="Country" value="US" style="flex:2; min-width:0; text-align:center; text-transform:uppercase;" oninput="ShippingManager.resetQuoteUI()">
              </div>

              <div class="saas-checkbox-bar" style="padding-top:4px;">
                <label><input type="radio" name="shipAddressType" value="commercial" checked onchange="ShippingManager.resetQuoteUI()"> Commercial</label>
                <label><input type="radio" name="shipAddressType" value="residential" onchange="ShippingManager.resetQuoteUI()"> Residential</label>
              </div>
            </div>
          </div>

        </div>

        <!-- RIGHT COLUMN: Package Math & Quoting -->
        <div style="display:flex; flex-direction:column; gap:14px;">
          
          <div class="saas-meta-well" style="margin-bottom:0; border-left:4px solid #0277bd;">
            <div class="flex-between" style="border-bottom:1px solid var(--border-color); padding-bottom:8px; margin-bottom:12px;">
              <div class="card-section-title" style="font-size:0.85rem; margin:0;">📦 Package Configuration</div>
              <button class="btn-saas-sub" onclick="ShippingManager.recalculateBoxMath(); ShippingManager.resetQuoteUI();">Auto-Recalculate</button>
            </div>
            
            <div style="display:flex; flex-direction:column; gap:12px;">
              <div>
                <label class="saas-label" style="display:block; margin-bottom:4px;">Calculated Box Size</label>
                <select id="shipBoxSize" class="saas-select" style="font-weight:700;" onchange="ShippingManager.handleBoxSizeChange(); ShippingManager.resetQuoteUI();">
                  <option value="XS">Extra Small (8 x 8 x 8)</option>
                  <option value="S">Small (12 x 6 x 6)</option>
                  <option value="M">Medium (22 x 13 x 15)</option>
                  <option value="L">Large (27 x 15 x 17)</option>
                  <option value="CUSTOM">Custom Dimensions...</option>
                </select>
              </div>

              <div class="saas-btn-row-3col">
                <div>
                  <label class="saas-label" style="display:block; margin-bottom:4px;">Length (in)</label>
                  <input type="number" id="shipDimL" class="saas-input" value="12" style="text-align:center;" oninput="ShippingManager.resetQuoteUI()">
                </div>
                <div>
                  <label class="saas-label" style="display:block; margin-bottom:4px;">Width (in)</label>
                  <input type="number" id="shipDimW" class="saas-input" value="6" style="text-align:center;" oninput="ShippingManager.resetQuoteUI()">
                </div>
                <div>
                  <label class="saas-label" style="display:block; margin-bottom:4px;">Height (in)</label>
                  <input type="number" id="shipDimH" class="saas-input" value="6" style="text-align:center;" oninput="ShippingManager.resetQuoteUI()">
                </div>
              </div>

              <div>
                <div class="flex-between" style="margin-bottom:4px;">
                  <label class="saas-label" style="color:#66bb6a;">Estimated Weight (lbs)</label>
                  <span id="shipWeightWarning" style="color:#ef5350; font-size:0.75rem; font-weight:700; display:none;">⚠️ Contains Non-Sutures</span>
                </div>
                <input type="number" id="shipWeight" class="saas-input font-mono" step="0.1" value="0.0" style="font-size:1.15rem; font-weight:700; text-align:center; border:2px solid #2e7d32;" oninput="ShippingManager.resetQuoteUI()">
              </div>
            </div>
          </div>

          <!-- Live Quoting & Label Purchase Container -->
          <div id="shipQuoteContainer" class="saas-meta-well" style="margin-bottom:0; display:flex; flex-direction:column; gap:10px; flex-grow:1; justify-content:center;">
            
            <button id="btnCalculateRate" class="btn-saas-primary" style="margin-top:0; display:flex; align-items:center; justify-content:center; gap:8px;" onclick="ShippingManager.checkUnsavedChanges(() => ShippingManager.calculateShippingRate())">
              <i data-lucide="calculator" style="width:18px; height:18px;"></i> Calculate Rate
            </button>

            <div id="shipPriceDisplay" style="display:none; flex-direction:column; gap:10px;">
              <div style="background:var(--card-bg); border:2px solid #2e7d32; border-radius:8px; padding:12px; text-align:center;">
                <div id="shipValidationBadge" style="color:#66bb6a; font-size:0.8rem; font-weight:700; margin-bottom:4px;">
                  <i data-lucide="check-circle" style="width:14px; height:14px; vertical-align:text-bottom;"></i> Validated Address
                </div>
                <div id="shipEstimatedCost" style="color:var(--heading-color); font-size:1.6rem; font-weight:900;">$0.00</div>
              </div>
              <button id="btnGenerateLabel" class="btn-saas-primary" style="margin-top:0; background:#2e7d32; display:flex; align-items:center; justify-content:center; gap:8px;" onclick="ShippingManager.generateFedExLabel()">
                <i data-lucide="printer" style="width:18px; height:18px;"></i> Purchase FedEx Label
              </button>
            </div>

            <div style="display:flex; gap:10px; margin-top:4px;">
              <button id="btnLogTrackingOnly" class="btn-saas-secondary" style="flex:1; padding:10px;" onclick="ShippingManager.checkUnsavedChanges(() => ShippingManager.logManualTracking())">
                Log Tracking Only
              </button>
              <button class="btn-saas-secondary" style="flex:1; padding:10px;" onclick="ShippingManager.checkUnsavedChanges(() => ShippingManager.skipAndComplete())">
                Skip
              </button>
            </div>

          </div>

        </div>

      </div>
    </div>

  </div>
</div>
