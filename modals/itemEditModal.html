<div id="itemEditModal" class="saas-modal-backdrop" style="display:none; z-index:999999;">
  <div class="saas-modal-card" style="max-width:520px;">
    
    <div class="saas-modal-header" style="border-bottom-color:#26a69a;">
      <h3 style="margin:0; color:var(--heading-color); display:flex; align-items:center; gap:8px;">
        <i data-lucide="pencil" style="width:18px; height:18px; color:#26a69a;"></i> Edit Catalog Item Details
      </h3>
      <button class="saas-modal-close" onclick="document.getElementById('itemEditModal').style.display='none'">×</button>
    </div>

    <div class="saas-modal-body" style="display:flex; flex-direction:column; gap:12px;">
      <div>
        <div class="flex-between" style="margin-bottom:4px;">
          <label class="saas-label">REF / SKU (Primary Key)</label>
          <button id="btnAdminRenameRef" onclick="DatabaseManager.promptRenameRef()" style="display:none; background:none; border:none; color:#ef5350; font-size:0.75rem; font-weight:700; cursor:pointer; text-decoration:underline;" title="Globally rename this REF across the entire system.">[ Admin Global Rename ]</button>
        </div>
        <input type="text" id="modalRef" class="saas-input font-mono" readonly style="opacity:0.75; font-weight:700;">
      </div>
      
      <div>
        <label class="saas-label" style="display:block; margin-bottom:4px;" title="Optional: An alternative name shown on customer-facing reports (e.g. '48360B (BX)'). Internal math will still use the strict REF.">Display Alias (Reports Only)</label>
        <input type="text" id="modalDisplayAlias" class="saas-input font-mono" style="font-weight:700;" placeholder="Optional report alias...">
      </div>

      <div>
        <label class="saas-label" style="display:block; margin-bottom:4px;">Manufacturer</label>
        <input type="text" id="modalMfr" class="saas-input">
      </div>

      <div>
        <label class="saas-label" style="display:block; margin-bottom:4px;">Catalog Description</label>
        <textarea id="modalDesc" class="saas-input" style="resize:vertical; min-height:64px;"></textarea>
      </div>

      <div class="saas-field-grid-2col" style="margin-bottom:0;">
        <div>
          <label class="saas-label" style="display:block; margin-bottom:4px;">Category</label>
          <input type="text" id="modalCat" class="saas-input">
        </div>
        <div>
          <label class="saas-label" style="display:block; margin-bottom:4px;">Shelf Location</label>
          <input type="text" id="modalShelf" class="saas-input font-mono" style="text-transform:uppercase;" placeholder="e.g. A-14">
        </div>
      </div>

      <div class="saas-field-grid-2col" style="margin-bottom:0;">
        <div>
          <label class="saas-label" style="display:block; margin-bottom:4px;">Catalog Status</label>
          <select id="modalStatus" class="saas-select" style="font-weight:700;">
            <option value="ACTIVE">ACTIVE</option>
            <option value="INACTIVE">INACTIVE</option>
          </select>
        </div>
        <div>
          <label class="saas-label" style="display:block; margin-bottom:4px;">Min Stock Alert Level</label>
          <input type="number" id="modalMinStock" min="0" class="saas-input" title="When available inventory falls to or below this number, the automated Restock Report is triggered.">
        </div>
      </div>
      
      <div id="modalBundleRow" class="saas-callout-row warning" style="display:none;">
        <label style="font-weight:700; font-size:0.83rem; color:#ffa726; display:flex; align-items:center; gap:8px; cursor:pointer;">
          <input type="checkbox" id="modalSellAsBoxOnly">
          Sell As Box Only (Hide individual 'Each' units from customer reports)
        </label>
      </div>

      <div id="modalPricingBlock" class="saas-meta-well" style="margin-bottom:0;">
        <!-- Pricing injected via JS -->
      </div>
    </div>

    <div class="saas-modal-footer">
      <button class="btn-saas-secondary" style="flex:1; padding:11px;" onclick="document.getElementById('itemEditModal').style.display='none'">Cancel</button>
      <button class="btn-saas-primary" style="flex:2; margin-top:0; padding:11px; background:#00796b;" onclick="DatabaseManager.saveModalEdits(); document.getElementById('itemEditModal').style.display='none'">
        <i data-lucide="save" style="width:16px; height:16px; vertical-align:middle; margin-right:6px;"></i>Apply Changes
      </button>
    </div>

  </div>
</div>
