<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASP IMS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/component.css">
  <link rel="stylesheet" href="css/utilities.css">
  <link rel="manifest" href="manifest.json">
  
  <!-- ✨ NEW: Placeholder meta tag for the dynamic theme color -->
  <meta name="theme-color" id="dynamicThemeColor" content="#ffffff">
  
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <script src="https://cdn.jsdelivr.net/npm/showdown/dist/showdown.min.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    #refInput, #lotInput, .manifest-ref-input { text-transform: uppercase; }
    .badge-info { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 0.78rem; font-weight: 700; }
    .badge-alert { background-color: rgba(211, 47, 47, 0.15); color: #ef5350; border: 1px solid #ef5350; }
  </style>
</head>
<body class="theme-gold">

  <!-- THE APP WILL INJECT ALL SCREENS INTO THIS EMPTY CONTAINER -->
  <div id="app-root"></div>

  <!-- Scripts -->
 <script src="js/config.js"></script>
  
  <script>
    if (typeof ENV_CONFIG !== 'undefined' && ENV_CONFIG.THEME_COLOR) {
      document.getElementById('dynamicThemeColor').content = ENV_CONFIG.THEME_COLOR;
    }
  </script>

  <!-- ✨ NEW FILES ADDED HERE -->
  <script src="js/apiManager.js"></script>
  <script src="js/manifestManager.js"></script>
  <script src="js/qboManager.js"></script>
  
  <script src="js/componentManager.js"></script>
  <script src="js/databaseManager.js"></script>
  <script src="js/uiManager.js"></script>
  <script src="js/scannerManager.js"></script>
  <script src="js/inventoryEngine.js"></script>
  <script src="js/sessionManager.js"></script>
  <script src="js/auditManager.js"></script>
  <script src="js/reportsManager.js"></script>
  <script src="js/authManager.js"></script>
  <script src="js/shippingManager.js"></script>
  <script src="js/shipmentTracker.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Native Service Worker Registration (Relies on Chrome's built-in update UI)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker registered natively.'))
          .catch(err => console.warn('Service Worker registration failed:', err));
      });
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Ethicon Monitor Modal -->
  <div id="ethiconMonitorModal" class="saas-modal-backdrop" style="display:none; z-index:999999;">
    <div class="saas-modal-card" style="max-width:600px;">
      
      <div class="saas-modal-header" style="border-bottom-color:#d32f2f;">
        <h2 style="margin:0; border:none; padding:0; color:#ef5350; font-size:1.25rem; display:flex; align-items:center; gap:8px;">
          <i data-lucide="shield-alert" style="width:22px; height:22px;"></i> Ethicon Discontinue Monitor
        </h2>
        <button class="saas-modal-close" onclick="document.getElementById('ethiconMonitorModal').style.display='none'">×</button>
      </div>
      
      <div class="saas-modal-body" style="display:flex; flex-direction:column; gap:16px;">
        
        <!-- LIVE SEARCH UI -->
        <div class="saas-meta-well" style="margin-bottom:0;">
          <div class="card-section-title" style="font-size:0.85rem; margin-bottom:8px;">Live J&J Catalog Search</div>
          <div style="display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap;">
            <input type="text" id="ethiconSearchInput" class="saas-input font-mono" placeholder="Search specific REF (e.g. CC41G)..." style="flex:2; text-transform:uppercase;">
            <button class="btn-saas-primary" style="width:auto; margin-top:0; padding:10px 16px;" onclick="window.runEthiconUiScan('SEARCH')">Search</button>
            <button class="btn-saas-sub-orange" style="padding:10px 14px; font-size:0.82rem; white-space:nowrap;" onclick="window.runEthiconUiScan('FULL')">Scan Full Inventory</button>
          </div>
          <div id="ethiconUiResults" class="saas-table-scroll" style="max-height:200px; padding:10px; font-size:0.85rem;">
            <div style="text-align:center; color:var(--text-main); opacity:0.7; font-style:italic;">Loading archived data...</div>
          </div>
        </div>

        <!-- SUBSCRIPTION UI -->
        <div class="saas-callout-row danger" style="display:flex; flex-direction:column; gap:10px;">
          <div style="font-weight:700; font-size:0.88rem; color:#ef5350; text-transform:uppercase;">Subscribe to Monthly Email Reports</div>
          <div style="display:flex; gap:8px; align-items:flex-end;">
            <div style="flex:1;">
              <label class="saas-label" style="display:block; margin-bottom:4px;">Email Address</label>
              <input type="email" id="ethiconMonitorEmail" class="saas-input" placeholder="name@alliedsurgicalproducts.com">
            </div>
            <button id="btnSubscribeEthicon" class="btn-saas-primary" style="width:auto; margin-top:0; padding:10px 16px; background:#d32f2f; white-space:nowrap;" onclick="window.subscribeToEthiconMonitor()">Subscribe</button>
          </div>
          
          <div style="padding-top:8px; border-top:1px dashed rgba(239, 83, 80, 0.4);">
            <label class="saas-label" style="display:block; margin-bottom:4px;">Current Subscribers</label>
            <div id="ethiconSubList" style="font-size:0.83rem; max-height:80px; overflow-y:auto; color:var(--text-main);">
              <i>Loading...</i>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</body>
</html>
