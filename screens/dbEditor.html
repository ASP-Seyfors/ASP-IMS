<!-- =======================================================================
 * Allied Surgical Products - Inventory Management System
 * File: screens/dbEditor.html (Modern Enterprise SaaS Layout)
 * ======================================================================= -->
<!-- DATABASE GRID EDITOR -->
<div id="screenDbEditor" style="display: none;" class="saas-dashboard-container">
  
  <!-- 1. Hub Header -->
  <div class="dashboard-header">
    <div class="brand-group">
      <h2><i data-lucide="database" style="width:20px; height:20px; vertical-align:middle; margin-right:8px;"></i>Master Catalog & Database Editor</h2>
    </div>
    <div class="header-actions">
      <button class="btn-saas-secondary" onclick="UIManager.closeDbEditor()">
        <i data-lucide="arrow-left" style="width:15px; height:15px; vertical-align:middle; margin-right:4px;"></i>Return
      </button>
    </div>
  </div>

  <!-- 2. Search & Filter Toolbar Card -->
  <div class="saas-meta-well" style="margin-bottom: 14px;">
    <div class="saas-field-grid-2col" style="margin-bottom: 10px;">
      <div>
        <label class="saas-label" style="display:block; margin-bottom:4px;">Search Catalog</label>
        <input type="text" id="dbSearchInput" class="saas-input" placeholder="Search REF, SKU, or Description..." oninput="DatabaseManager.renderDbGridEditor()">
      </div>
      <div>
        <label class="saas-label" style="display:block; margin-bottom:4px;">Manufacturer Filter</label>
        <select id="dbMfrFilter" class="saas-select" onchange="DatabaseManager.renderDbGridEditor()">
          <option value="ALL">All Manufacturers</option>
        </select>
      </div>
    </div>

    <div class="saas-checkbox-bar">
      <label style="color: #ba68c8;">
        <input type="checkbox" id="chkShowBoxOnly" onchange="DatabaseManager.renderDbGridEditor()"> 📦 Show Box / Bundle Variants Only
      </label>
      <label style="color: #ef5350;">
        <input type="checkbox" id="chkNeedsPrice" onchange="DatabaseManager.renderDbGridEditor()"> 🏷️ Items Needing Price
      </label>
      <label style="color: #ffa726;">
        <input type="checkbox" id="chkNeedsPriceInStock" onchange="DatabaseManager.renderDbGridEditor()"> ⚠️ Missing Price & In Stock
      </label>
    </div>
  </div>
  
  <!-- 3. Enterprise Data Table -->
  <div class="saas-table-scroll" style="max-height: 58vh; margin-bottom: 16px;">
    <table class="saas-data-table">
      <thead>
        <tr>
          <th style="width: 16%;">MFR</th>
          <th style="width: 22%;">REF / SKU</th>
          <th style="width: 40%;">Description</th>
          <th style="width: 12%; text-align: center;">Avail Qty</th>
          <th style="width: 10%; text-align: center;">Actions</th>
        </tr>
      </thead>
      <tbody id="dbGridBody">
        <!-- Injected via JS -->
      </tbody>
    </table>
  </div>

  <!-- 4. Footer Sync & Backup Bar -->
  <div class="dashboard-footer" style="margin-top: 8px;">
    <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
      <button class="btn-saas-secondary" style="padding: 9px 14px;" onclick="DatabaseManager.downloadCloudDatabase(event)">
        <i data-lucide="cloud-download" style="width:15px; height:15px; vertical-align:middle; margin-right:6px;"></i>Sync Cloud DB
      </button>
      <button class="btn-saas-footer-amber" style="padding: 9px 14px;" onclick="DatabaseManager.uploadPendingData(event)" title="Push local catalog edits to Google Sheets">
        <i data-lucide="upload-cloud" style="width:15px; height:15px; vertical-align:middle; margin-right:6px;"></i>Upload Pending Edits
      </button>
    </div>
    <button class="btn-saas-primary" style="width: auto; margin-top: 0; padding: 9px 18px; background-color: #2e7d32; font-size: 0.85rem;" onclick="DatabaseManager.backupFullDatabase()">
      <i data-lucide="save" style="width:15px; height:15px; vertical-align:middle; margin-right:6px;"></i>Backup Database JSON
    </button>
  </div>

</div>
