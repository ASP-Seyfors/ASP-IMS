<!-- SCREEN 9: DATABASE GRID EDITOR -->
<div id="screenDbEditor" style="display: none;" class="card">
  <div class="flex-between" style="border-bottom: 2px solid #00796b; padding-bottom: 6px; margin-bottom: 10px;">
    <h2 style="border:none; margin:0; padding:0; color: #00796b;">Database Grid Editor</h2>
    <div style="display:flex; gap:8px;">
      <button class="btn-small btn-auto" style="background-color: #c62828; color: #fff; margin:0;" onclick="DatabaseManager.factoryResetDatabase()">⚠️ JSON Reset</button>
      <button class="btn-small btn-auto" style="background-color: #0277bd; color: #fff; margin:0;" onclick="DatabaseManager.syncMasterDatabase(event)">☁️ Sync Updates from DB</button>
      <button class="btn-small btn-cancel btn-auto" onclick="UIManager.closeDbEditor()">🔙 Return</button>
    </div>
  </div>
  <p style="font-size: 0.8rem; color: #555;">Edit fields directly in the table. Click "Export Database Update" below to save changes for control review.</p>
  
  <div style="overflow-x: auto; max-height: 60vh; border: 1px solid #ccc; margin-bottom: 15px;">
    <table style="width: 100%; border-collapse: collapse; font-size: 0.85rem; background: #fff;">
      <thead style="position: sticky; top: 0; background: #e0f2f1; box-shadow: 0 2px 2px -1px rgba(0,0,0,0.4);">
        <tr>
          <th style="padding: 8px; border: 1px solid #ccc;">MFR</th>
          <th style="padding: 8px; border: 1px solid #ccc;">REF / SKU</th>
          <th style="padding: 8px; border: 1px solid #ccc; width: 40%;">Description</th>
          <th style="padding: 8px; border: 1px solid #ccc;">Category</th>
          <th style="padding: 8px; border: 1px solid #ccc;">GTIN</th>
        </tr>
      </thead>
      <tbody id="dbGridBody">
        <!-- Injected via JS -->
      </tbody>
    </table>
  </div>

  <div style="text-align: right;">
    <button class="btn-action btn-save btn-auto" onclick="DatabaseManager.exportGridChanges()">💾 Export Database Update (JSON)</button>
  </div>
</div>
