 * File: screens/archive.html (Modern Enterprise SaaS Layout)
 * ======================================================================= -->
<!-- SESSION ARCHIVE -->
<div id="screenArchive" style="display: none;" class="saas-dashboard-container">
  
  <!-- 1. Hub Header -->
  <div class="dashboard-header">
    <div class="brand-group">
      <h2><i data-lucide="archive" style="width:20px; height:20px; vertical-align:middle; margin-right:8px;"></i>Session Archive & Cloud Vault</h2>
    </div>
    <div class="header-actions">
      <button class="btn-saas-secondary" style="display:none; background-color: #2e7d32; color: #fff; border:none;" onclick="SessionManager.pushLegacySessionsToCloud(event)">
        <i data-lucide="upload-cloud" style="width:14px; height:14px; vertical-align:middle; margin-right:4px;"></i>Upload Local History
      </button>
      <button class="btn-saas-secondary" style="border-color: var(--heading-color); color: var(--heading-color);" onclick="SessionManager.syncCloudArchive(event)">
        <i data-lucide="cloud-download" style="width:15px; height:15px; vertical-align:middle; margin-right:4px;"></i>Sync Cloud Directory
      </button>
      <button class="btn-saas-secondary" onclick="SessionManager.closeArchive()">
        <i data-lucide="arrow-left" style="width:15px; height:15px; vertical-align:middle; margin-right:4px;"></i>Return
      </button>
    </div>
  </div>
  
  <p style="font-size: 0.85rem; color: var(--text-main); opacity: 0.85; margin: 0 0 14px 0;">
    Restore active local sessions on this device, or browse the Cloud Vault to inspect and pull down historical session payloads.
  </p>

  <!-- 2. Storage Source Switcher -->
  <div style="display:flex; gap:8px; margin-bottom:16px;">
    <button id="tabLocalArchive" class="btn-action btn-auto" style="flex:1; margin:0; background-color:#0277bd; color:#fff; border-radius:8px; padding:10px !important;" onclick="SessionManager.switchArchiveTab('local')">
      <i data-lucide="smartphone" style="width:16px; height:16px; vertical-align:middle; margin-right:6px;"></i>Local Device Cache
    </button>
    <button id="tabCloudArchive" class="btn-action btn-auto" style="flex:1; margin:0; background-color:#f5f5f5; color:#555; border:1px solid #ccc; border-radius:8px; padding:10px !important;" onclick="SessionManager.switchArchiveTab('cloud')">
      <i data-lucide="cloud" style="width:16px; height:16px; vertical-align:middle; margin-right:6px;"></i>Cloud Vault Directory
    </button>
  </div>

  <!-- 3. Filter & Search Toolbar -->
  <div class="saas-meta-well" style="margin-bottom: 16px;">
    <div class="saas-field-grid-2col" style="margin-bottom: 10px;">
      <div>
        <label class="saas-label" style="display:block; margin-bottom:4px;">Search Sessions</label>
        <input type="text" id="archiveSearchInput" class="saas-input" placeholder="Search Customer, Supplier, PO#, or Session ID..." onkeyup="SessionManager.renderArchiveList()">
      </div>
      <div>
        <label class="saas-label" style="display:block; margin-bottom:4px;">Timeframe Filter</label>
        <select id="archiveFilter" class="saas-select" onchange="SessionManager.renderArchiveList()" style="font-weight: 700;">
          <option value="today">Today (Last 24 Hrs)</option>
          <option value="week">This Week (Last 7 Days)</option>
          <option value="month" selected>This Month (Last 30 Days)</option>
          <option value="all">All Time</option>
        </select>
      </div>
    </div>
    
    <div class="saas-checkbox-bar">
      <label><input type="checkbox" id="chkHideCancelled" onchange="SessionManager.renderArchiveList()" checked> Hide Cancelled Sessions</label>
      <label><input type="checkbox" id="chkOnlyActive" onchange="SessionManager.renderArchiveList()"> Show Only Pending / Active</label>
    </div>
  </div>

  <!-- 4. Session Cards List -->
  <div id="archiveListContainer" style="max-height: 460px; overflow-y: auto; padding-right: 4px;">
    <!-- Injected via JS -->
  </div>

</div>
