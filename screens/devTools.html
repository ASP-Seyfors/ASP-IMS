<!-- SCREEN 11: DEVELOPER TOOLS -->
<div id="screenDevTools" style="display: none;" class="card">
  <div class="flex-between" style="border-bottom: 2px solid #c62828; padding-bottom: 6px; margin-bottom: 15px;">
    <h2 style="border:none; margin:0; padding:0; color: #c62828;">🛠️ Developer Tools</h2>
    <button class="btn-small btn-cancel btn-auto" onclick="UIManager.closeDevTools()">🔙 Return</button>
  </div>

  <p style="font-size: 0.85rem; color: #555; margin-bottom: 20px;">Restricted administrative and debugging utilities. Do not run without supervision.</p>

  <!-- Sandbox Toggle (Moved from Settings) -->
  <div style="background: #ffebee; border: 1px dashed #c62828; padding: 12px; border-radius: 4px; margin-bottom: 15px;">
    <label for="chkSandboxMode" style="color: #c62828; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 1rem;">
      <input type="checkbox" id="chkSandboxMode" name="chkSandboxMode" onchange="handleSandboxToggle(this)" style="transform: scale(1.2);">
      Enable Testing Sandbox Mode
    </label>
    <div style="font-size: 0.8rem; color: #c62828; margin-top: 6px;">Routes all saves, databases, and syncs to the TEST DATABASE.</div>
  </div>

  <!-- System Restore (Moved from Audit Hub) -->
  <div style="background: #fff3e0; border: 1px solid #e65100; padding: 12px; border-radius: 4px; margin-bottom: 20px;">
    <h4 style="margin: 0 0 10px 0; color: #e65100;">⚠️ Event Replay & Restore</h4>
    <button class="btn-action btn-auto" style="background-color: #c62828; color: #fff; width: 100%; padding: 10px; font-weight: bold;" onclick="AuditManager.openRestoreModal()">⏪ Execute System Restore</button>
  </div>

  <!-- New Custom Debug Console -->
  <h4 style="margin: 0 0 6px 0; color: #333;">Live Debug Console</h4>
  <div id="customDebugConsole" style="background: #1a1d20; color: #a5d6a7; font-family: monospace; font-size: 0.8rem; height: 250px; overflow-y: auto; padding: 10px; border-radius: 4px; border: 2px solid #000; display: flex; flex-direction: column;">
    <div style="color: #888; border-bottom: 1px solid #444; padding-bottom: 4px; margin-bottom: 4px;">> Console initialized...</div>
  </div>
  <div style="text-align: right; margin-top: 6px;">
    <button class="btn-small" style="background: #555; color: #fff;" onclick="document.getElementById('customDebugConsole').innerHTML=''">Clear Console</button>
  </div>
</div>
