<!-- HELP & DOCUMENTATION PAGE -->
<div id="screenHelp" style="display: none;" class="saas-dashboard-container">
  
  <!-- 1. Header -->
  <div class="dashboard-header">
    <div class="brand-group">
      <h2><i data-lucide="book-open" style="width:20px; height:20px; vertical-align:middle; margin-right:8px;"></i>Warehouse Operations Guide</h2>
    </div>
    <div class="header-actions">
      <button class="btn-saas-secondary" onclick="UIManager.closeHelpScreen()">
        <i data-lucide="arrow-left" style="width:15px; height:15px; vertical-align:middle; margin-right:4px;"></i>Return to Settings
      </button>
    </div>
  </div>

  <!-- 2. Sticky Keyword Search Bar -->
  <div class="lookup-box-saas" style="position: sticky; top: 0; z-index: 10; margin-bottom: 16px;">
    <label class="saas-label" style="display: block; margin-bottom: 6px;">Search Documentation</label>
    <input type="text" id="helpSearchInput" class="saas-input input-highlight" placeholder="Type a keyword to highlight and jump to section..." oninput="
      (function(inputEl){
        var query = inputEl.value.toLowerCase().trim();
        var container = document.getElementById('helpContentContainer');
        if (!container) return;
        var orig = container.getAttribute('data-original-html');
        if (!orig) { orig = container.innerHTML; container.setAttribute('data-original-html', orig); }
        else { container.innerHTML = orig; }
        if (!query) return;
        var escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        var walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, null, false);
        var nodes = [];
        while (walker.nextNode()) {
          var n = walker.currentNode;
          if (n.nodeValue.toLowerCase().includes(query) && n.parentNode.nodeName !== 'SCRIPT' && n.parentNode.nodeName !== 'STYLE') nodes.push(n);
        }
        nodes.forEach(function(node){
          var span = document.createElement('span');
          span.innerHTML = node.nodeValue.replace(new RegExp('(' + escaped + ')', 'gi'), '<mark style=\'background:#ffca28; color:#111; padding:1px 4px; border-radius:3px; font-weight:700;\'>$1</mark>');
          node.parentNode.replaceChild(span, node);
        });
        var first = container.querySelector('mark');
        if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
      })(this)
    ">
  </div>

  <!-- 3. Markdown Content Reader Well -->
  <div id="helpContentContainer" class="saas-help-reader">
    <!-- Markdown content loaded here -->
  </div>

</div>
