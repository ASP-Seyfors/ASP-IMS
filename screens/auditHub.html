<!-- SCREEN 5: AUDIT HUB & TRACEABILITY -->
<div id="screenAuditHub" style="display: none;" class="card">
  <div class="flex-between" style="border-bottom: 2px solid #8b8589; padding-bottom: 6px; margin-bottom: 10px;">
    <h2 style="border:none; margin:0; padding:0;">Traceability & Audit Tool</h2>
    <!-- LOT TRACEABILITY TOOL -->
    <div style="background: #e3f2fd; border: 1px solid #0277bd; padding: 12px; border-radius: 4px; margin-bottom: 15px;">
      <h4 style="margin: 0 0 10px 0; color: #0277bd;">🔎 Active Recall & Lot Traceability</h4>
        <div style="display: flex; gap: 8px; margin-bottom: 10px;">
          <input type="text" id="lotSearchInput" placeholder="Scan or type Lot Number..." style="flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px;" oninput="this.value = this.value.toUpperCase();">
          <button class="btn-action" style="background-color: #0277bd; color: #fff; margin: 0; padding: 8px 16px;" onclick="AuditManager.traceLotNumber()">Trace</button>
        </div>
      <div id="lotTraceResults"></div>
    </div>
    <button class="btn-small btn-cancel btn-auto" onclick="closeAuditHub()">🔙 Return</button>
  </div>
  
  <p style="font-size: 0.85rem; color: #555; margin-bottom: 12px;">
    Select a timeframe below to pull a comprehensive lifecycle audit, FEFO traceability report, or Thrive batch exports directly from the live Cloud Ledger.
  </p>

  <div class="form-row" style="margin-bottom: 20px;">
    <div class="form-label" style="color: #0277bd;">Timeframe:</div>
    <div class="input-wrapper" style="display:flex; gap:8px;">
      <select id="traceTimeframe" style="flex:2; border: 2px solid #0277bd; font-weight: bold; padding: 10px; border-radius: 4px;">
        <option value="24h">Today (Last 24 Hours)</option>
        <option value="7d" selected>Last 7 Days (End of Week)</option>
        <option value="30d">Last 30 Days (Monthly)</option>
        <option value="90d">Last 90 Days (Quarterly)</option>
        <option value="all">Year-to-Date / All Time</option>
      </select>
      <button id="btnGenerateTrace" class="btn-action btn-auto" style="margin:0; flex:1; background-color: #0277bd; color: #fff; padding: 10px;" onclick="AuditManager.fetchAndCompileTraceability()">🔍 Generate Traceability</button>
    </div>
  </div>

  <div style="background: #ffebee; border: 1px solid #e53935; padding: 12px; border-radius: 4px; margin-bottom: 15px;">
    <h4 style="margin: 0 0 10px 0; color: #c62828;">⚠️ Administrative Tools</h4>
    <button class="btn-action btn-auto" style="background-color: #c62828; color: #fff; width: 100%; padding: 8px;" onclick="AuditManager.openRestoreModal()">⏪ System Restore (Event Replay)</button>
  </div>

  <div id="auditResultsContainer" style="display:none; margin-top:16px;">
    
    <!-- Export Actions Panel -->
    <div class="export-panel" style="margin-bottom: 15px;">
      <h4 style="margin: 0 0 8px 0; color: #0277bd;">Export Multi-Session Reports</h4>
      <div style="display: flex; gap: 8px; flex-wrap: wrap;">
        <select id="auditExportDropdown" style="flex: 2; padding: 8px; font-size: 0.85rem;">
          <option value="pdf">🖨️ Export PDF Audit Report</option>
          <option value="txt">📄 Export TXT Summary</option>
        </select>
        <button class="btn-action btn-auto" style="background-color: #0277bd; color: #fff; margin: 0; padding: 8px 14px;" onclick="executeAuditExport()">Generate</button>
      </div>

      <div style="display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap;">
        <!-- Thrive Buttons -->
        <button class="btn-small btn-auto" style="background-color: #0277bd; color: #fff;" onclick="AuditManager.exportThriveCreates()">➕ Thrive Bulk Create</button>
        <button class="btn-small btn-auto" style="background-color: #0277bd; color: #fff;" onclick="AuditManager.exportThriveVariants()">🏷️ Thrive Edit Variants (Price/Qty)</button>
        <button class="btn-small btn-auto" style="background-color: #0277bd; color: #fff;" onclick="AuditManager.exportThriveProducts()">📝 Thrive Edit Products (Desc/Status)</button>
        
        <!-- NEW Shopify Buttons -->
        <button class="btn-small btn-auto" style="background-color: #95bf47; color: #fff; border-color: #5c7a29;" onclick="AuditManager.exportShopifyProducts()">🛍️ Shopify Export Products (Master)</button>
        <button class="btn-small btn-auto" style="background-color: #95bf47; color: #fff; border-color: #5c7a29;" onclick="AuditManager.exportShopifyInventory()">📦 Shopify Export Inventory (Available Qty)</button>
        
        <button class="btn-small btn-auto" style="background-color: #7b1fa2; color: #fff;" onclick="AuditManager.exportUpdatedDatabaseJSON()">💾 Updated Database JSON</button>
      </div>
    </div>

    <!-- Audited Results Content -->
    <div id="auditPreviewContent">
      <!-- Injected via JavaScript -->
    </div>
  </div>
</div>
