<!-- =======================================================================
 * Allied Surgical Products - Inventory Management System
 * File: screens/summary.html (Modern Enterprise SaaS Layout)
 * ======================================================================= -->
<!-- SCREEN 4: SESSION SUMMARY PHASE -->
<div id="screenSummary" style="display: none;" class="saas-scanning-container">
  
  <!-- 1. Active Session Command Header -->
  <div class="scanning-header-card">
    <div class="scanning-meta-group">
      <div class="session-badge-wrapper">
        <span id="hdrWorkflowSum" class="saas-workflow-pill">Workflow</span>
        <span class="operator-tag"><i data-lucide="user" style="width:13px; height:13px; vertical-align:text-bottom;"></i> <span id="hdrUserSum">--</span></span>
      </div>
      <h3 id="hdrTitleSum" class="scanning-session-title">Customer (Order)</h3>
    </div>
    <div class="scanning-header-right">
      <div class="session-time-block">
        <span><strong>Date:</strong> <span id="hdrDateSum">--</span></span>
        <span><strong>Start:</strong> <span id="hdrTimeSum">--</span></span>
      </div>
    </div>
  </div>

  <!-- 2. Session Action Command Bar -->
  <div class="saas-card" style="padding: 16px 20px;">
    <div class="card-section-title" style="margin-bottom: 10px;">
      <i data-lucide="sliders-horizontal" style="width:16px; height:16px; vertical-align:middle; margin-right:8px;"></i>Session Actions
    </div>
    <div style="display: flex; gap: 10px; align-items: stretch;">
      <select id="exportDropdown" class="saas-select" style="flex: 3; font-weight: 700;" title="Select an action to conclude or manage this session.">
        <option value="continue" selected>➕ Continue Scanning</option>
        <option value="commit_stock" id="optCommitStock" style="display:none; font-weight:bold;">💾 Commit Stocktake to Database</option>
        <option value="backorder">⏳ Suspend Session / Save as Pending</option>
        <option value="exit_restored">🔙 Return Home Without Changes (View Only)</option>
        <option value="cancel">❌ Discard & Cancel Scanning Session</option>
        <option value="complete">✅ Session Complete (Return Home)</option>
      </select>
      <button class="btn-saas-primary" style="flex: 1; margin-top: 0; padding: 10px 18px; width: auto;" onclick="executeAction()" title="Execute the selected action.">
        Go ➔
      </button>
    </div>
  </div>

  <!-- 3. Manifest Discrepancies Card (Conditional) -->
  <div class="saas-card saas-alert-card warning" id="manifestReconcileCard" style="display: none;">
    <div class="card-section-title" style="color: #ff9800; margin-bottom: 6px;">
      <i data-lucide="triangle-alert" style="width:18px; height:18px; vertical-align:middle; margin-right:8px;"></i>Discrepancies Detected
    </div>
    <p style="font-size:0.85rem; color:var(--text-main); opacity:0.85; margin:0 0 12px 0;">
      Discrepancies found between expected manifest and scanned items. Review scanned logs below or update expected values:
    </p>
    <div id="manifestReconcileList"></div>
    <div style="text-align: right; margin-top: 12px;">
      <button class="btn-saas-sub-orange" style="padding: 8px 16px; font-size: 0.82rem;" onclick="SessionManager.saveManifestReconciliation()" title="Save these corrections to the expected order list.">
        🔄 Update Manifest & Recalculate
      </button>
    </div>
  </div>

  <!-- 4. Resolve New Items Card (Conditional) -->
  <div class="saas-card saas-alert-card info" id="advancedReviewCard" style="display: none;">
    <div class="card-section-title" style="margin-bottom: 8px;">
      <i data-lucide="wrench" style="width:18px; height:18px; vertical-align:middle; margin-right:8px;"></i>Resolve New Items
    </div>
    <div id="advancedItemsList" style="margin-top:10px;"></div>
    <div style="text-align: right; margin-top: 12px;">
      <button class="btn-saas-primary" style="width: auto; margin-top: 0; padding: 8px 20px; background-color: #2e7d32; font-size: 0.85rem;" onclick="SessionManager.saveAdvancedDescriptions()" title="Save these new descriptions to the database.">
        💾 Save New Descriptions
      </button>
    </div>
  </div>

  <!-- 5. Current Session Logs Card -->
  <div class="saas-card">
    <div class="flex-between" style="border-bottom: 1px solid var(--border-color); padding-bottom: 12px; margin-bottom: 12px; flex-wrap: wrap; gap: 10px;">
      <div class="card-section-title" style="margin: 0;">
        <i data-lucide="layers" style="width:18px; height:18px; vertical-align:middle; margin-right:8px;"></i>Current Session Logs
      </div>
      <div class="saas-kpi-badges">
        <span class="saas-kpi-pill">Unique REFs: <strong id="sumUniqueRefs">0</strong></span>
        <span class="saas-kpi-pill">Total Qty: <strong id="sumTotalQty">0</strong></span>
      </div>
    </div>

    <label style="font-weight:700; cursor:pointer; font-size:0.83rem; color:#ff9800; display:inline-flex; align-items:center; gap:6px; margin-bottom:12px;" title="Attach a general note to this entire scanning session.">
      <input type="checkbox" id="chkSessionNote" onchange="toggleSessionNote()"> 📝 Add Session Note
    </label>
    <div id="rowSessionNote" style="display:none; margin-bottom:16px;">
      <textarea id="sessionNoteInput" class="saas-input" rows="2" style="resize:vertical;" placeholder="Missing items, extra items, carrier notes..."></textarea>
    </div>
    
    <div id="summaryListContainer">
      <!-- Injected via JavaScript -->
    </div>
  </div>

</div>
