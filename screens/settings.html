<!-- SCREEN 7: SETTINGS PAGE -->
<div id="screenSettings" style="display: none;" class="card">
  <div class="flex-between" style="border-bottom: 2px solid #8b8589; padding-bottom: 6px; margin-bottom: 15px;">
    <h2 style="border:none; margin:0; padding:0;">ASP Scanner - Settings</h2>
    <button class="btn-small btn-cancel btn-auto" onclick="SessionManager.closeSettings()">🔙 Return</button>
  </div>

  <div class="form-row">
    <div class="form-label">App Theme:</div>
    <div class="input-wrapper">
      <select id="themeSelect" onchange="UIManager.changeAppTheme(this.value)">
        <option value="slate">Slate & Charcoal</option>
        <option value="sage">Sage & Khaki</option>
        <option value="gold">Classic Gold</option>
      </select>
    </div>
  </div>

  <div class="form-row">
    <div class="form-label">Font Size:</div>
    <div class="input-wrapper">
      <select id="fontSizeSelect" onchange="UIManager.changeFontSize(this.value)">
        <option value="small">Small (85%)</option>
        <option value="medium" selected>Medium (100% - Default)</option>
        <option value="large">Large (115%)</option>
      </select>
    </div>
  </div>

  <div class="form-row" style="margin-top: 15px; border-top: 1px solid #eee; padding-top: 15px;">
    <div class="form-label">User Manual:</div>
    <div class="input-wrapper">
      <button class="btn-action btn-auto" style="background-color: #0277bd; color: #fff; margin:0; width: 100%; padding: 8px;" onclick="UIManager.openHelpScreen()">📖 Operations Guide</button>
    </div>
  </div>

  <div class="form-row" style="margin-top: 15px; border-top: 1px solid #eee; padding-top: 15px;">
    <div class="form-label">Storage Optimization:</div>
    <div class="input-wrapper">
      <button class="btn-action btn-auto" style="background-color: #f57f17; color: #fff; margin:0; width: 100%; padding: 8px;" onclick="offloadAndPurgeHistory(event)">🧹 Offload & Purge Local History</button>
    </div>
  </div>

  <div class="form-row" style="margin-top: 15px; border-top: 1px solid #eee; padding-top: 15px;">
    <div class="form-label">Catalog Cache:</div>
    <div class="input-wrapper">
      <button class="btn-action btn-auto" style="background-color: #c62828; color: #fff; margin:0; width: 100%; padding: 8px;" onclick="DatabaseManager.factoryResetDatabase()">⚠️ JSON Database Reset</button>
    </div>
  </div>

  <div class="form-row" style="margin-top: 20px;">
    <div class="form-label">App Version:</div>
    <div class="input-wrapper" style="display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%;">
      <div>
        <span style="font-weight: bold; color: #0277bd;">v3.2.6</span>
        <button class="btn-small btn-auto" style="background-color: #0277bd; color: #ffffff; margin-left: 10px;" onclick="checkAppUpdates()">🔄 Check for Updates</button>
      </div>
      <button class="btn-small btn-cancel btn-auto" onclick="AuthManager.logout()">🚪 Log Out</button>
    </div>
  </div>
</div>
