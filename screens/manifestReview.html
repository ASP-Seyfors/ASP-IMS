<!-- MANIFEST REVIEW & VERIFICATION -->
<div id="screenManifestReview" style="display: none;" class="saas-dashboard-container">
  
  <div class="dashboard-header">
    <div class="brand-group">
      <h2><i data-lucide="clipboard-check" style="width:20px; height:20px; vertical-align:middle; margin-right:8px;"></i>Verify Expected Order Manifest</h2>
    </div>
  </div>
  
  <div id="manifestReviewSummaryContainer" class="saas-manifest-review-list">
    <!-- Summary Injected via JS -->
  </div>

  <div class="scanning-actions-footer">
    <button class="btn-saas-secondary" style="flex: 1; padding: 12px; border-color: #f57f17; color: #ff9800; font-weight: 700;" onclick="returnToManifestEdit()">
      <i data-lucide="arrow-left" style="width:15px; height:15px; vertical-align:middle; margin-right:6px;"></i>Return to Pre-Loading
    </button>
    <button class="btn-saas-primary" style="flex: 2; margin-top: 0; background-color: #2e7d32;" onclick="confirmManifestAndStart()">
      <i data-lucide="check-circle" style="width:17px; height:17px; vertical-align:middle; margin-right:6px;"></i>Confirm & Begin Scanning
    </button>
  </div>

</div>
